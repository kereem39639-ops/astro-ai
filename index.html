<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Astro AI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game">
  <div id="screen-home" class="screen active">
    <div class="logo">ASTRO AI</div>
    <div class="planet-big"></div>
    <button class="btn-play" onclick="goToMap()">العب دلوقتي</button>
  </div>
  <div id="screen-map" class="screen">
    <h2>اختار كوكبك يا بطل</h2>
    <div class="planets">
      <div class="planet mars" onclick="openPlanet('المريخ')">المريخ</div>
      <div class="planet earth" onclick="openPlanet('الأرض')">الأرض</div>
    </div>
    <button class="btn-back" onclick="goHome()">رجوع</button>
  </div>
  <div id="nova-box">
    <div id="nova-face">🤖</div>
    <div id="nova-text">أهلا! أنا نوفا، يلا نطير؟</div>
  </div>
</div>
<script src="nova.js"></script>
</body>
  </html>
